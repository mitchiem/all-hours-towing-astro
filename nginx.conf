server {
    listen 3000;
    server_name www.bigalandtheboyz.com;
    return 301 https://bigalandtheboyz.com$request_uri;
}

server {
    listen 3000;
    server_name bigalandtheboyz.com localhost;
    root /app/dist;
    index index.html;

    # --- 301 redirects (before location /) ---
    absolute_redirect off;

    # Priority redirects
    location = /home { return 301 /; }
    location = /towing-macon-ga { return 301 /locations/macon; }
    location = /towing-covington-georgia { return 301 /locations/covington; }
    location = /testimonials { return 301 /reviews; }
    location = /book { return 301 /contact; }
    location = /book-now { return 301 /contact; }
    location = /faq { return 301 /about; }
    location = /macon { return 301 /locations/macon; }
    location = /covington { return 301 /locations/covington; }
    location = /conyers { return 301 /locations/conyers; }
    location = /byron { return 301 /locations/byron; }
    location = /perry { return 301 /locations/perry; }
    location = /gray { return 301 /locations/gray; }
    location = /oxford { return 301 /locations/oxford; }
    location = /porterdale { return 301 /locations/porterdale; }
    location = /centerville { return 301 /locations/centerville; }
    location = /warner-robins { return 301 /locations/warner-robins; }
    location = /social-circle { return 301 /locations/social-circle; }
    location = /accident-recovery { return 301 /services/accident-recovery; }
    location = /excavation { return 301 /services/land-clearing-grading; }
    location = /excavation-clearing-grading { return 301 /services/land-clearing-grading; }
    location = /terms-of-service { return 301 /about; }
    location = /services/light-and-medium-duty-towing/aldora { return 301 /services/light-medium-duty-towing; }
    location = /locations/lithonia { return 301 /locations; }
    location = /rest-haven { return 301 /locations; }

    # Thin city catch-all redirects
    location ~ ^/locations/(gordon|lizella|roberta|jeffersonville|newborn|porterdale|social-circle|mansfield|jersey|oxford|bonaire|fort-valley)/(light-medium-duty-towing|roadside-assistance|motorcycle-towing|lockout-services|disaster-recovery|accident-recovery|jumpstart-services|winching-services|land-clearing-grading|storage-building-transport) {
        return 301 /locations/$1;
    }

    # Static files
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Sitemap and robots
    location = /sitemap.xml { try_files /sitemap.xml =404; }
    location = /robots.txt { try_files /robots.txt =404; }
}
